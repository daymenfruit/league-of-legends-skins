<section class="content-wrap">
    <div>
        <div class="select-area">
            <p-multiselect
                [options]="champList"
                [(ngModel)]="selectedChampions"
                (onChange)="selectChange($event)"
                placeholder="Select a champion"
                class="multiselect"
            />
        </div>
        <div class="checkbox-area">
            <p-checkbox [binary]="true" (onChange)="showLegacyChange($event)"/>
            <label >Show legacy</label>
        </div>
        <div class="tree-area">
            <p-tree [value]="skins$ | async" />
        </div>
    </div>
    <!-- <div class="button-area">
        <p-button label="check" />
    </div> -->
</section>
